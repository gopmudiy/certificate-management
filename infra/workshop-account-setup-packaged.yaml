AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "CertAgent Workshop \u2014 Full Account Setup (Workshop Studio Auto-Deploy)\
  \ Deploys everything into a fresh account: VPC, SageMaker Domain + Space, Lambda\
  \ functions, DynamoDB, SNS, EventBridge, Secrets Manager. The SageMaker lifecycle\
  \ config auto-clones the notebooks from GitHub.\nThis template is deployed automatically\
  \ by Workshop Studio when a participant account is provisioned.\n"
Parameters:
  WorkshopPrefix:
    Type: String
    Default: certagent
  NotebooksRepoUrl:
    Type: String
    Default: https://github.com/gopmudiy/certificate-management.git
  NotebooksBranch:
    Type: String
    Default: workshop-notebooks
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        DIGICERT_API_SECRET_ARN:
          Ref: DigiCertApiKeySecret
        CERT_TABLE_NAME:
          Ref: CertInventoryTable
        CERT_SECRETS_PREFIX:
          Fn::Sub: /${WorkshopPrefix}/certs
        NOTIFICATION_TOPIC_ARN:
          Ref: NotificationTopic
        DIGICERT_BASE_URL: https://www.digicert.com/services/v2
        EXPIRY_THRESHOLD_DAYS: '30'
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${WorkshopPrefix}-vpc
    Metadata:
      SamResourceId: VPC
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Metadata:
      SamResourceId: InternetGateway
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: VPC
      InternetGatewayId:
        Ref: InternetGateway
    Metadata:
      SamResourceId: VPCGatewayAttachment
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${WorkshopPrefix}-public-1
    Metadata:
      SamResourceId: PublicSubnet1
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${WorkshopPrefix}-public-2
    Metadata:
      SamResourceId: PublicSubnet2
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: VPC
    Metadata:
      SamResourceId: PublicRouteTable
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId:
        Ref: InternetGateway
    Metadata:
      SamResourceId: PublicRoute
  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet1
      RouteTableId:
        Ref: PublicRouteTable
    Metadata:
      SamResourceId: PublicSubnet1RouteAssoc
  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet2
      RouteTableId:
        Ref: PublicRouteTable
    Metadata:
      SamResourceId: PublicSubnet2RouteAssoc
  CertInventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${WorkshopPrefix}-inventory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: domain
        AttributeType: S
      - AttributeName: order_id
        AttributeType: S
      KeySchema:
      - AttributeName: domain
        KeyType: HASH
      - AttributeName: order_id
        KeyType: RANGE
    Metadata:
      SamResourceId: CertInventoryTable
  DigiCertApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: /${WorkshopPrefix}/digicert-api-key
      SecretString: '{"api_key": "WORKSHOP_MOCK_KEY_NOT_REAL"}'
    Metadata:
      SamResourceId: DigiCertApiKeySecret
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${WorkshopPrefix}-notifications
    Metadata:
      SamResourceId: NotificationTopic
  ScanCertificatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${WorkshopPrefix}-scan-certificates
      CodeUri: s3://certagent-deploy-995023805016-us-east-1/certagent-lambda/7cbc1c32cfe0b7b4df863b095c5c6230
      Handler: handler.lambda_handler
      Policies:
      - SecretsManagerReadWrite
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CertInventoryTable
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - NotificationTopic
            - TopicName
    Metadata:
      SamResourceId: ScanCertificatesFunction
  RenewCertificateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${WorkshopPrefix}-renew-certificate
      CodeUri: s3://certagent-deploy-995023805016-us-east-1/certagent-lambda/d6e89e20f7fa535268f7b5af5cd0d46c
      Handler: handler.lambda_handler
      Timeout: 120
      Policies:
      - SecretsManagerReadWrite
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CertInventoryTable
    Metadata:
      SamResourceId: RenewCertificateFunction
  CheckStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${WorkshopPrefix}-check-status
      CodeUri: s3://certagent-deploy-995023805016-us-east-1/certagent-lambda/34af38b6baa092a0246d05e984d11d1d
      Handler: handler.lambda_handler
      Policies:
      - SecretsManagerReadWrite
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CertInventoryTable
    Metadata:
      SamResourceId: CheckStatusFunction
  DownloadCertificateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${WorkshopPrefix}-download-certificate
      CodeUri: s3://certagent-deploy-995023805016-us-east-1/certagent-lambda/c8ccd4121cef1beed8c0805f0f6e89d9
      Handler: handler.lambda_handler
      Policies:
      - SecretsManagerReadWrite
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CertInventoryTable
    Metadata:
      SamResourceId: DownloadCertificateFunction
  StoreCertificateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${WorkshopPrefix}-store-certificate
      CodeUri: s3://certagent-deploy-995023805016-us-east-1/certagent-lambda/d43772cedcd229a04183463b38d84906
      Handler: handler.lambda_handler
      Policies:
      - SecretsManagerReadWrite
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CertInventoryTable
    Metadata:
      SamResourceId: StoreCertificateFunction
  ListInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${WorkshopPrefix}-list-inventory
      CodeUri: s3://certagent-deploy-995023805016-us-east-1/certagent-lambda/5df0e69916c0ef8712475ffa8a61ff3e
      Handler: handler.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: CertInventoryTable
    Metadata:
      SamResourceId: ListInventoryFunction
  SlackHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${WorkshopPrefix}-slack-handler
      CodeUri: s3://certagent-deploy-995023805016-us-east-1/certagent-lambda/08cf2c0a3e1e68b86f9d08f6bb21121a
      Handler: slack_handler.lambda_handler
      Timeout: 120
      Environment:
        Variables:
          BEDROCK_AGENT_ID: PLACEHOLDER
          BEDROCK_AGENT_ALIAS_ID: PLACEHOLDER
      Policies:
      - SecretsManagerReadWrite
      - Statement:
        - Effect: Allow
          Action: bedrock:InvokeAgent
          Resource: '*'
      Events:
        SlackEvent:
          Type: Api
          Properties:
            Path: /slack/events
            Method: post
    Metadata:
      SamResourceId: SlackHandlerFunction
  DailyScanRule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: ${WorkshopPrefix}-daily-scan
      ScheduleExpression: cron(0 8 * * ? *)
      State: ENABLED
      Targets:
      - Arn:
          Fn::GetAtt:
          - ScanCertificatesFunction
          - Arn
        Id: DailyScan
        Input: '{"source": "aws.events", "use_mock": true}'
    Metadata:
      SamResourceId: DailyScanRule
  DailyScanPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ScanCertificatesFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - DailyScanRule
        - Arn
    Metadata:
      SamResourceId: DailyScanPermission
  SSMRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/region
      Type: String
      Value:
        Ref: AWS::Region
    Metadata:
      SamResourceId: SSMRegion
  SSMCertTable:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/cert-table-name
      Type: String
      Value:
        Ref: CertInventoryTable
    Metadata:
      SamResourceId: SSMCertTable
  SSMDigiCertSecret:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/digicert-secret-arn
      Type: String
      Value:
        Ref: DigiCertApiKeySecret
    Metadata:
      SamResourceId: SSMDigiCertSecret
  SSMSNSTopic:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/sns-topic-arn
      Type: String
      Value:
        Ref: NotificationTopic
    Metadata:
      SamResourceId: SSMSNSTopic
  SSMLambdaScan:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/lambda-scan
      Type: String
      Value:
        Ref: ScanCertificatesFunction
    Metadata:
      SamResourceId: SSMLambdaScan
  SSMLambdaRenew:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/lambda-renew
      Type: String
      Value:
        Ref: RenewCertificateFunction
    Metadata:
      SamResourceId: SSMLambdaRenew
  SSMLambdaStatus:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/lambda-status
      Type: String
      Value:
        Ref: CheckStatusFunction
    Metadata:
      SamResourceId: SSMLambdaStatus
  SSMLambdaDownload:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/lambda-download
      Type: String
      Value:
        Ref: DownloadCertificateFunction
    Metadata:
      SamResourceId: SSMLambdaDownload
  SSMLambdaStore:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/lambda-store
      Type: String
      Value:
        Ref: StoreCertificateFunction
    Metadata:
      SamResourceId: SSMLambdaStore
  SSMLambdaInventory:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/lambda-inventory
      Type: String
      Value:
        Ref: ListInventoryFunction
    Metadata:
      SamResourceId: SSMLambdaInventory
  SSMSecretsPrefix:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/cert-secrets-prefix
      Type: String
      Value:
        Fn::Sub: /${WorkshopPrefix}/certs
    Metadata:
      SamResourceId: SSMSecretsPrefix
  SSMWorkshopPrefix:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /workshop/${WorkshopPrefix}/prefix
      Type: String
      Value:
        Ref: WorkshopPrefix
    Metadata:
      SamResourceId: SSMWorkshopPrefix
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${WorkshopPrefix}-sagemaker-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: sagemaker.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
      - PolicyName: WorkshopPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: LambdaAccess
            Effect: Allow
            Action:
            - lambda:InvokeFunction
            - lambda:AddPermission
            - lambda:RemovePermission
            - lambda:GetPolicy
            - lambda:GetFunctionConfiguration
            Resource:
              Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkshopPrefix}-*
          - Sid: DynamoDBAccess
            Effect: Allow
            Action:
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
            - dynamodb:Query
            Resource:
              Fn::GetAtt:
              - CertInventoryTable
              - Arn
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:PutSecretValue
            - secretsmanager:CreateSecret
            - secretsmanager:ListSecrets
            - secretsmanager:DeleteSecret
            Resource:
              Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${WorkshopPrefix}/*
          - Sid: SSMAccess
            Effect: Allow
            Action:
            - ssm:GetParameter
            - ssm:PutParameter
            - ssm:GetParametersByPath
            Resource:
              Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/workshop/${WorkshopPrefix}/*
          - Sid: BedrockAccess
            Effect: Allow
            Action:
            - bedrock:*
            - bedrock-agent:*
            - bedrock-agentcore:*
            Resource: '*'
          - Sid: IAMForAgentCore
            Effect: Allow
            Action:
            - iam:CreateRole
            - iam:DeleteRole
            - iam:GetRole
            - iam:PutRolePolicy
            - iam:DeleteRolePolicy
            - iam:AttachRolePolicy
            - iam:DetachRolePolicy
            - iam:PassRole
            - iam:TagRole
            Resource:
            - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/${WorkshopPrefix}*
            - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/AmazonBedrockAgentCore*
          - Sid: CodeBuildForAgentCore
            Effect: Allow
            Action: codebuild:*
            Resource:
              Fn::Sub: arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/bedrock-agentcore-*
          - Sid: ECRForAgentCore
            Effect: Allow
            Action:
            - ecr:CreateRepository
            - ecr:DescribeRepositories
            - ecr:GetAuthorizationToken
            - ecr:BatchCheckLayerAvailability
            - ecr:PutImage
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            Resource: '*'
          - Sid: S3ForAgentCore
            Effect: Allow
            Action: s3:*
            Resource:
            - Fn::Sub: arn:aws:s3:::bedrock-agentcore-*
            - Fn::Sub: arn:aws:s3:::bedrock-agentcore-*/*
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:PutResourcePolicy
            - logs:DescribeResourcePolicies
            - logs:DescribeLogGroups
            - logs:GetLogEvents
            - logs:FilterLogEvents
            Resource: '*'
          - Sid: SNSAccess
            Effect: Allow
            Action:
            - sns:ListTopics
            - sns:Subscribe
            - sns:Publish
            Resource: '*'
          - Sid: EventBridgeAccess
            Effect: Allow
            Action:
            - events:DescribeRule
            - events:ListTargetsByRule
            Resource:
              Fn::Sub: arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${WorkshopPrefix}-*
    Metadata:
      SamResourceId: SageMakerExecutionRole
  LifecycleConfig:
    Type: AWS::SageMaker::StudioLifecycleConfig
    Properties:
      StudioLifecycleConfigName:
        Fn::Sub: ${WorkshopPrefix}-on-start
      StudioLifecycleConfigAppType: JupyterLab
      StudioLifecycleConfigContent:
        Fn::Base64:
          Fn::Sub: "#!/bin/bash\nset -eux\nREGION=\"${AWS::Region}\"\nPREFIX=\"${WorkshopPrefix}\"\
            \nREPO=\"${NotebooksRepoUrl}\"\nBRANCH=\"${NotebooksBranch}\"\nDIR=\"\
            /home/sagemaker-user/certagent-workshop\"\n\n# Install deps\npip install\
            \ -q \"cryptography>=42.0.0\" \"pydantic>=2.0.0\" \"pyyaml>=6.0.0\" \"\
            tabulate>=0.9.0\" \"boto3>=1.35.0\"\n\n# Clone or update repo\nif [ -d\
            \ \"$DIR/.git\" ]; then\n  git -C \"$DIR\" pull --rebase origin \"$BRANCH\"\
            \ || true\nelse\n  git clone --branch \"$BRANCH\" \"$REPO\" \"$DIR\"\n\
            \  # Remove .git so JupyterLab uses standard file tracking (not git-based)\n\
            \  rm -rf \"$DIR/.git\"\nfi\n\n# Write config from SSM\nP=\"/workshop/$PREFIX\"\
            \nget() { aws ssm get-parameter --region \"$REGION\" --name \"$P/$1\"\
            \ --query 'Parameter.Value' --output text 2>/dev/null || echo \"\"; }\n\
            cat > /tmp/certagent_config.json <<EOF\n{\n  \"AWS_REGION\": \"$REGION\"\
            ,\n  \"WORKSHOP_PREFIX\": \"$PREFIX\",\n  \"CERT_TABLE_NAME\": \"$(get\
            \ cert-table-name)\",\n  \"DIGICERT_SECRET_ARN\": \"$(get digicert-secret-arn)\"\
            ,\n  \"CERT_SECRETS_PREFIX\": \"$(get cert-secrets-prefix)\",\n  \"SNS_TOPIC_ARN\"\
            : \"$(get sns-topic-arn)\",\n  \"LAMBDA_SCAN\": \"$(get lambda-scan)\"\
            ,\n  \"LAMBDA_RENEW\": \"$(get lambda-renew)\",\n  \"LAMBDA_STATUS\":\
            \ \"$(get lambda-status)\",\n  \"LAMBDA_DOWNLOAD\": \"$(get lambda-download)\"\
            ,\n  \"LAMBDA_STORE\": \"$(get lambda-store)\",\n  \"LAMBDA_INVENTORY\"\
            : \"$(get lambda-inventory)\",\n  \"REPO_DIR\": \"$DIR\"\n}\nEOF\n\n#\
            \ Notebooks are served directly from the git clone path\n# Do NOT copy\
            \ - JupyterLab file ID tracking breaks on copied files\n# Participants\
            \ open from: certagent-workshop/notebooks/\n\n# Clean up dot folders that\
            \ clutter the file browser\n# NOTE: Do NOT delete .local or .jupyter -\
            \ they contain JupyterLab runtime state\nrm -rf /home/sagemaker-user/.agent\
            \ 2>/dev/null || true\nrm -rf /home/sagemaker-user/.cache/pip 2>/dev/null\
            \ || true\nrm -rf /home/sagemaker-user/.claude 2>/dev/null || true\nrm\
            \ -rf /home/sagemaker-user/.kiro 2>/dev/null || true\nrm -rf /home/sagemaker-user/.npm\
            \ 2>/dev/null || true\n\necho \"=== CertAgent workshop ready ===\"\necho\
            \ \"Open notebooks from: certagent-workshop/notebooks/\"\n"
    Metadata:
      SamResourceId: LifecycleConfig
  SageMakerDomain:
    Type: AWS::SageMaker::Domain
    Properties:
      DomainName:
        Fn::Sub: ${WorkshopPrefix}-domain
      AuthMode: IAM
      VpcId:
        Ref: VPC
      SubnetIds:
      - Ref: PublicSubnet1
      - Ref: PublicSubnet2
      DefaultUserSettings:
        ExecutionRole:
          Fn::GetAtt:
          - SageMakerExecutionRole
          - Arn
    Metadata:
      SamResourceId: SageMakerDomain
  UserProfile:
    Type: AWS::SageMaker::UserProfile
    Properties:
      DomainId:
        Ref: SageMakerDomain
      UserProfileName:
        Fn::Sub: ${WorkshopPrefix}-participant
      UserSettings:
        ExecutionRole:
          Fn::GetAtt:
          - SageMakerExecutionRole
          - Arn
        JupyterLabAppSettings:
          LifecycleConfigArns:
          - Fn::GetAtt:
            - LifecycleConfig
            - StudioLifecycleConfigArn
          DefaultResourceSpec:
            InstanceType: ml.t3.medium
            LifecycleConfigArn:
              Fn::GetAtt:
              - LifecycleConfig
              - StudioLifecycleConfigArn
    Metadata:
      SamResourceId: UserProfile
  JupyterSpace:
    Type: AWS::SageMaker::Space
    DependsOn: UserProfile
    Properties:
      DomainId:
        Ref: SageMakerDomain
      SpaceName:
        Fn::Sub: ${WorkshopPrefix}-lab
      OwnershipSettings:
        OwnerUserProfileName:
          Fn::Sub: ${WorkshopPrefix}-participant
      SpaceSettings:
        AppType: JupyterLab
        JupyterLabAppSettings:
          DefaultResourceSpec:
            InstanceType: ml.t3.medium
            LifecycleConfigArn:
              Fn::GetAtt:
              - LifecycleConfig
              - StudioLifecycleConfigArn
        SpaceStorageSettings:
          EbsStorageSettings:
            EbsVolumeSizeInGb: 20
      SpaceSharingSettings:
        SharingType: Private
    Metadata:
      SamResourceId: JupyterSpace
Outputs:
  SageMakerDomainUrl:
    Description: Open SageMaker Studio here
    Value:
      Fn::Sub: https://${SageMakerDomain}.studio.${AWS::Region}.sagemaker.aws
  SpaceName:
    Description: "JupyterLab space name \u2014 launch this after opening Studio"
    Value:
      Fn::Sub: ${WorkshopPrefix}-lab
  Instructions:
    Description: Getting started
    Value: "1. Open the SageMaker Studio URL above\n2. Launch the certagent-lab space\n\
      3. Open certagent-notebooks/01_explore_lambdas.ipynb\n4. All infrastructure\
      \ is already deployed \u2014 start the labs immediately\n"
  CertTableName:
    Value:
      Ref: CertInventoryTable
  SNSTopicArn:
    Value:
      Ref: NotificationTopic
  SlackEventUrl:
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/slack/events
